<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 独数九宫格</title>
    <style>
        body { background: #1a1a2e; color: #fff; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: rgba(255,255,255,0.1); padding: 40px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #ffd700; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px; background: rgba(255,255,255,0.2); color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #ffd700; border: none; border-radius: 8px; color: #1a1a2e; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .msg { margin-top: 15px; min-height: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔐 身份验证</h2>
        <input type="text" id="user" placeholder="用户名 / 邮箱">
        <input type="password" id="pass" placeholder="密码">
        <button onclick="login()">🚀 验证并进入系统</button>
        <div id="msg" class="msg"></div>
    </div>
    <script>
        function safeParse(str) {
            try { return JSON.parse(str); } catch { return null; }
        }

        function normalizeLoginTarget(value) {
            const raw = String(value || '').trim();
            if (!raw) return 'index.html';
            if (/^game_main\.html$/i.test(raw)) return 'index.html';
            return raw;
        }

        async function resolveLoginTarget() {
            const override = normalizeLoginTarget(localStorage.getItem('mayiju_login_target'));
            try {
                const resp = await fetch(override, { method: 'HEAD', cache: 'no-store' });
                if (resp && resp.ok) return override;
            } catch (e) {}
            return 'index.html';
        }

        async function login() {
            const user = String(document.getElementById('user').value || '').trim();
            const pass = String(document.getElementById('pass').value || '').trim();
            const msg = document.getElementById('msg');
            if (!user || !pass) { msg.textContent = '请输入用户名和密码'; msg.style.color = '#ff6b6b'; return; }
            msg.textContent = '验证中...'; msg.style.color = '#ffd700';

            const existing = safeParse(localStorage.getItem('currentUser')) || {};
            const merged = Object.assign({}, existing, {
                username: user,
                isLoggedIn: true
            });
            localStorage.setItem('currentUser', JSON.stringify(merged));
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('mayiju_login_target', 'index.html');

            const target = await resolveLoginTarget();
            setTimeout(function() {
                window.location.href = target;
            }, 260);
        }
    </script>
</body>
</html>
