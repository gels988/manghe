<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 独数九宫格</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background-color: #1e1e1e; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
        .login-container h2 { margin-bottom: 1.5rem; color: #ffd700; }
        .form-group { margin-bottom: 1rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #aaa; }
        .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #333; border-radius: 6px; background-color: #2a2a2a; color: #fff; box-sizing: border-box; }
        .login-btn { width: 100%; padding: 0.75rem; background-color: #ffd700; color: #121212; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 1rem; transition: background-color 0.3s; }
        .login-btn:hover { background-color: #e6c200; }
        .message { margin-top: 1rem; font-size: 0.9rem; min-height: 1.2em; }
        .back-link { display: block; margin-top: 1.5rem; color: #888; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: #ffd700; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>🔑 身份验证</h2>
        <div class="form-group">
            <label for="login-email">邮箱 / 用户名</label>
            <input type="text" id="login-email" placeholder="请输入邮箱或用户名">
        </div>
        <div class="form-group">
            <label for="login-password">密码</label>
            <input type="password" id="login-password" placeholder="请输入密码">
        </div>
        <button id="loginSubmitBtn" class="login-btn">🚀 验证并进入游戏</button>
        <div id="login-message" class="message"></div>
        <a href="register.html" class="back-link">← 返回注册页面</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const submitBtn = document.getElementById('loginSubmitBtn');
            const messageEl = document.getElementById('login-message');

            submitBtn.addEventListener('click', async () => {
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;

                if (!email || !password) {
                    messageEl.textContent = '请输入邮箱和密码';
                    messageEl.style.color = '#ff4444';
                    return;
                }

                messageEl.textContent = '验证中...';
                messageEl.style.color = '#ffd700';

                try {
                    // 模拟登录验证并保存会话状态
                    const mockUser = { id: 'user_' + Date.now(), email: email, gas_balance: 100 };
                    localStorage.setItem('currentUser', JSON.stringify(mockUser));
                    localStorage.setItem('mayiju.session', JSON.stringify({ userId: mockUser.id }));

                    messageEl.textContent = '验证成功，正在进入游戏...';
                    messageEl.style.color = '#00cc66';

                    // 延迟 1 秒后跳转至游戏主画面 (index.html)
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);

                } catch (error) {
                    console.error(error);
                    messageEl.textContent = '验证失败，请检查账号密码';
                    messageEl.style.color = '#ff4444';
                }
            });
        });
    </script>
</body>
</html>
