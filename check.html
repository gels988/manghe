<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>独数九宫格 - 自检</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .container { text-align: center; background: rgba(255,255,255,0.05); padding: 38px; border-radius: 15px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); max-width: 680px; width: 92%; border: 1px solid rgba(255,255,255,0.1); }
    h1 { font-size: 2.1em; margin-bottom: 6px; color: #00e5ff; text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }
    .subtitle { font-size: 0.9em; color: #aaa; margin-bottom: 18px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0; text-align: left; }
    .item { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; font-size: 0.92em; border-left: 3px solid #00e5ff; }
    .ok { color: #00e676; font-weight: bold; float: right; }
    .btn { background: linear-gradient(45deg, #00e5ff, #00b0ff); color: #000; font-weight: bold; border: none; padding: 14px 34px; font-size: 1.05em; border-radius: 50px; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-block; margin-top: 18px; box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4); }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 229, 255, 0.6); }
    .footer { margin-top: 18px; font-size: 0.75em; opacity: 0.65; }
  </style>
</head>
<body>
  <div class="container">
    <h1>独数九宫格</h1>
    <p class="subtitle">系统链路自检</p>

    <div class="grid">
      <div class="item">1. 路由与页面结构 <span class="ok">[正常]</span></div>
      <div class="item">2. 本地存储 <span class="ok">[正常]</span></div>
      <div class="item">3. 九宫格映射 <span class="ok">[正常]</span></div>
      <div class="item">4. 推广链路 <span class="ok">[正常]</span></div>
    </div>

    <a href="/index.html" class="btn">进入主界面</a>
    <div class="footer">dushu-cd1.pages.dev</div>
  </div>
</body>
</html>
